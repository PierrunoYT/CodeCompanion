name: Release

# Push a tag such as v0.1.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require signing credentials
        shell: bash
        run: |
          if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "::error::Releases require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD repository secrets. Unsigned releases are disabled."
            exit 1
          fi
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm 11 skips install scripts unless allowed in package.json; make sure the Electron binary is there.
      - run: node node_modules/electron/install.js

      - name: Check the tag matches the package version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e

      # Local builds may be unsigned, but a release must never silently fall back to an unsigned artifact.
      - run: npx electron-builder --win --publish never --config.forceCodeSigning=true
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify release signatures
        shell: pwsh
        run: |
          foreach ($path in @('dist/win-unpacked/Patch.exe', 'dist/Patch-Installer.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path -ErrorAction Stop
            if ($signature.Status -ne 'Valid') {
              throw "Invalid release signature on ${path}: $($signature.Status)"
            }
            Write-Output "Verified release signature: $path"
          }

      # A checksum file, attached to the release, so a download can be verified.
      - name: Write the checksums
        shell: bash
        run: (cd dist && sha256sum Patch-Installer.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Release notes: this version's section of CHANGELOG.md plus a link to the full file at this tag.
      - name: Write the release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tr -d '\r' < CHANGELOG.md | awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for version $version in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "---"
            echo "SHA-256 of \`Patch-Installer.exe\`: \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\` (also in \`SHA256SUMS.txt\`)."
            echo "The installer and the app are code-signed; both Authenticode signatures were verified before publishing."
            echo
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          } >> release-notes.md

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Patch-Installer.exe" "dist/SHA256SUMS.txt" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
